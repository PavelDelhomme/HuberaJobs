version: 1.0.60+60

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.1.3
  intl: ^0.20.2
  path_provider: ^2.1.1
